services:
  demo:
    build: .
    image: retailpulse-ai:rp11-local
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8501:8501"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /app/artifacts:size=256m,uid=10001,gid=10001,mode=0700
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    stop_grace_period: 15s
