[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "retailpulse-ai"
version = "0.1.0"
description = "Retail demand analytics with traceability and reproducibility."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas",
    "pyarrow",
    "duckdb",
    "pydantic",
    "pyyaml",
    "lightgbm==4.7.0",
    "mlflow-skinny==3.17.0",
    "sqlalchemy==2.1.4",
    "alembic==1.20.0",
    "psutil==7.2.2",
    "fastapi==0.142.4",
    "uvicorn==0.54.0",
    "streamlit==1.65.0",
    "httpx==0.28.1",
    "altair==6.3.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
browser = ["playwright==1.63.0"]

[tool.setuptools.package-data]
"retailpulse.api" = ["synthetic/*.csv", "synthetic/*.json", "synthetic/docs/*.md"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
files = ["src/retailpulse/agent/contracts.py", "src/retailpulse/api/contracts.py", "src/retailpulse/api/language.py", "src/retailpulse/api/observability.py"]
strict = true
follow_imports = "silent"
warn_unused_configs = true

[tool.coverage.run]
branch = true
source = ["src/retailpulse", "app"]
relative_files = true

[tool.coverage.report]
precision = 2
show_missing = true
fail_under = 85
