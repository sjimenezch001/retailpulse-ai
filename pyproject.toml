[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "retailpulse-ai"
version = "0.1.0"
description = "Retail demand analytics with traceability and reproducibility."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas",
    "pyarrow",
    "duckdb",
    "pydantic",
    "pyyaml",
    "lightgbm==4.7.0",
    "mlflow-skinny==3.17.0",
    "sqlalchemy==2.1.4",
    "alembic==1.20.0",
    "psutil==7.2.2",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
