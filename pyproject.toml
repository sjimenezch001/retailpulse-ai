[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "retailpulse-ai"
version = "0.1.0"
description = "Analítica de demanda para retail con trazabilidad y reproducibilidad."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas",
    "pyarrow",
    "duckdb",
    "pydantic",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
