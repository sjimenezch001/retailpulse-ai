name: Validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - name: Install pinned application and toolchain
        run: python scripts/tasks.py setup
      - name: Lint, scoped strict types, portable tests and coverage
        run: python scripts/tasks.py verify
      - name: Dependency vulnerability and entire-tree secret scans
        run: python scripts/tasks.py security
      - name: Build distributable
        run: python scripts/tasks.py build
      - name: Publish coverage and sanitized reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: reports-${{ matrix.os }}
          path: |
            reports/coverage.xml
            reports/coverage.json
            reports/dependencies.json
            reports/secrets.json
          retention-days: 14
          if-no-files-found: warn

  container:
    name: container
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate Compose and build actual image
        run: |
          docker compose -p rp11-ci config --quiet
          docker compose -p rp11-ci build
      - name: Start synthetic demo and wait for health
        run: docker compose -p rp11-ci up -d --wait --wait-timeout 120
      - name: Check API/UI and grounded synthetic response
        run: |
          python scripts/check_portable.py
          test "$(docker compose -p rp11-ci exec -T demo id -u)" = "10001"
          docker compose -p rp11-ci exec -T demo python -c "from pathlib import Path; assert not list(Path('/app').rglob('*.pbix')); assert not Path('/app/data').exists(); assert not Path('/app/models').exists()"
      - name: Publish sanitized container acceptance
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: container-acceptance
          path: reports/portable.json
          retention-days: 14
          if-no-files-found: warn
      - name: Stop this job's containers
        if: always()
        run: docker compose -p rp11-ci down --volumes --remove-orphans

  aws-offline:
    name: aws-offline
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
      CHECKPOINT_DISABLE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            cloud/aws/requirements.txt
      - name: Install application test environment
        run: python scripts/tasks.py setup
      - name: Install isolated pinned SDK and checksum-verified Terraform
        run: |
          python -m pip install --ignore-installed --target artifacts/rp12/sdk -r cloud/aws/requirements.txt
          python scripts/install_terraform.py
      - name: Prepare synthetic references and deployment bundles offline
        run: python scripts/aws_lab.py prepare
      - name: Validate infrastructure with explicit mocks and network-blocked Python tests
        run: python scripts/aws_lab.py validate
      - name: Audit every isolated SDK dependency
        run: python scripts/audit_aws_dependencies.py
      - name: Publish offline validation receipts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: aws-offline-reports
          path: |
            artifacts/rp12/validate_result.json
            reports/aws_dependencies.json
          retention-days: 14
          if-no-files-found: warn
